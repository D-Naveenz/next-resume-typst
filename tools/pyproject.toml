[project]
name = "nextresume-tool"
version = "0.5.0"
description = "Centralized tooling host for NextResume"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pikepdf==10.5.1",
  "rich==15.0.0",
  "textual==8.2.5",
  "typer==0.25.1",
  "watchfiles==1.1.1",
]

[project.scripts]
nextresume = "nextresume_tool.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextresume_tool"]
