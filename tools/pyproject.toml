[project]
name = "nextresume-tool"
version = "0.1.0"
description = "Centralized tooling host for NextResume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pikepdf>=9.0",
  "rich>=14.0.0",
  "textual>=0.63.0",
  "typer>=0.16.0",
  "watchfiles>=1.0.0",
]

[project.scripts]
nextresume = "nextresume_tool.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextresume_tool"]

