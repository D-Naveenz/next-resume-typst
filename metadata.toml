        "Performance Optimization",
        "Scalable System Design",
        "Cross-Platform Development",
        "Open Source Development",
        "Technical Leadership",
        "Problem Solving",
        "Agile Methodologies",
        "Python",
        "JavaScript",
        "TypeScript",
        "Lua",
        "MS SQL Server",
        "MySQL",
        "SQLite",
        "Firebase",
