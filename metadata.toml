#:schema https://raw.githubusercontent.com/yunanwg/brilliant-CV/main/metadata.toml.schema.json

# Must match folder suffix: "en" -> modules_en/, "fr" -> modules_fr/, etc.
language = "en"

[next_resume]
    # Must exactly match the root VERSION file or Typst compilation fails.
    version = "0.5.0"

[layout]
    # Accent color used for section titles, icons, and highlights in the rendered PDF
    # Preset: skyblue, red, nephritis, concrete, darknight - or any hex like "#1E90FF"
    awesome_color = "skyblue"

    # Vertical space after the header before the first CV section.
    after_header_skip = "12pt"
    # Vertical space after a section title before the section content starts.
    after_section_title_skip = "6pt"
    # Vertical space after an entry header before body text.
    after_entry_header_skip = "1pt"
    # Vertical space after entry body text before tag pills.
    after_entry_body_skip = "1pt"
    # Vertical space after each entry block before the next block or section.
    after_entry_skip = "8pt"

    # Page dimensions and margins applied to the PDF output. Possible values: a4 (default), us-letter
    paper_size = "a4"

    # Overrides the width of the right-side date column in entries; omit to use sensible defaults
    date_width = "4.8cm"

    # Overrides base font size for body text; affects overall density of content
    #font_size = "9pt"

    [layout.fonts]
        # Typeface used for body text, entry descriptions, and general content
        regular_fonts = ["Source Sans 3"]
        # Typeface used for the name and section headings in the header
        header_font = "Roboto"

    [layout.header]
        # Aligns the entire header block (name, info, quote). Possible values: left, center, right.
        # When display_profile_photo is false, use "center" for a classic centered no-photo header.
        header_align = "left"

        # false hides the photo and gives full width to name/info.
        display_profile_photo = true
        # "50%" = circle, "0%" = square, "10%" = rounded corners
        profile_photo_radius = "50%"
        # Font size for the contact-info line (email, phone, links) in the header
        info_font_size = "10pt"

    [layout.entry]
        # true = company name bold on top, role below; false = role bold on top
        # true shows society/company before role/title in entry headers
        display_entry_society_first = true

        # false hides all company/organisation logos in entries
        display_logo = true

    [layout.project]
        # Vertical space after project title/subtitle before metadata links.
        after_header_skip = "0pt"
        # Vertical space after metadata links before project body text.
        after_links_skip = "1pt"
        # Font size for project metadata links.
        link_font_size = "9pt"
        # Horizontal gap between link groups, such as Repository and Deployment.
        link_gap = "1em"

    [layout.certificates]
        # Vertical space after the Certificates section title before rows start.
        after_section_title_skip = "6pt"
        # Vertical space after the Certificates section before the next section.
        after_section_skip = "6pt"
        # Vertical space after each compact certificate row.
        after_row_skip = "0pt"

    [layout.skills]
        # Vertical space after the Skills section title before rows start.
        after_section_title_skip = "6pt"
        # Vertical space after the Skills section before the next section.
        after_section_skip = "0pt"
        # Vertical space after each skill row.
        after_row_skip = "1pt"

    [layout.footer]
        # true shows the NextResume outlined SVG footer on CV pages
        display_footer = true

[personal]
    # Your first name, displayed in the header
    first_name = "Naveen"
    # Your last name, displayed in the header
    last_name = "Dharmathunga"
    # Profile image used by cv.typ for the resume header photo
    profile_photo = "assets/profile-naveen.png"
    # Scale-up adds extra enlargement above the minimum full-cover crop
    # profile_photo_scale_up = 0
    # Offsets let you nudge the image inside the circular crop
    # profile_photo_offset_x = "0pt"
    # profile_photo_offset_y = "0pt"
    # Your mailing address, used as default sender-address in the cover letter
    # address = "123 Main St, San Francisco, CA 94102"

    # The order of entries below controls the display order of icons/links in the header.
    # Header contact links render as "Label: handle" while storing the full URL in the PDF link target.
    [personal.info]
        # Shown as GitHub: <value>; links to github.com/<value>
        github = "D-Naveenz"
        # Shown as Phone: <value>; links to tel:<value-without-spaces>
        phone = "+94729883668"
        # Shown as Email: <value>; links to mailto:<value>
        email = "dasheenaveen@outlook.com"
        # Shown as LinkedIn: <value>; links to linkedin.com/in/<value>
        linkedin = "dasheewd"
        # Shown as Location: <value>; displayed as plain text
        location = "Yakkala, Sri Lanka"
        # Shown as X: <value>; links to x.com/<value-without-@>
        x = "dharmathunga"
        # Shown as Medium: <value>; links to medium.com/@<value>
        medium = "@dasheewd"
        # Shown as Website: <value>; links to https://<value>. Comment out until the portfolio exists.
        # homepage = "naveendharmathunga.dev"
        # extraInfo = "Available for remote work"  # Shown as Info: <value>
        # Insert a line break in the header info, splitting icons across two lines
        #linebreak = ""

# Add a [lang.xx] section for each language you support.
[lang.en]
    # Italic tagline displayed below your name and contact info
    header_quote = "Associate Software Engineer"
    # Text shown on the right side of the outlined CV footer
    cv_footer = "Resume"
    # Text shown in the left side of the footer on cover letter pages
    letter_footer = "Cover letter"

